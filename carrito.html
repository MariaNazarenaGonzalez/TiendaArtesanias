<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | NGENECHEN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/carrito.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="carrito">
    <header class="site-header">
        <nav class="nav container" aria-label="Navegacion principal">
            <a class="brand" href="index.html">NGENECHEN</a>
            <div class="nav-links">
                <a href="catalogo.html">Catalogo</a>
                <a href="contacto.html">Contacto</a>
                <a class="cart-link" href="carrito.html" aria-current="page">Carrito <span data-cart-count hidden>0</span></a>
            </div>
        </nav>
    </header>

    <main class="page-main container">
        <section class="page-title">
            <p class="eyebrow">Compra</p>
            <h1>Carrito</h1>
        </section>

        <section data-cart-container aria-live="polite"></section>

        <div class="cart-actions">
            <button class="button button-secondary" type="button" data-clear-cart>Vaciar carrito</button>
            <button class="button button-primary" type="button" data-checkout>Finalizar por WhatsApp</button>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>NGENECHEN. Tejido artesanal en Argentina.</p>
            <a href="catalogo.html">Seguir comprando</a>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
