<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | NGENECHEN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/carrito.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="contacto">
    <header class="site-header">
        <nav class="nav container" aria-label="Navegacion principal">
            <a class="brand" href="index.html">NGENECHEN</a>
            <div class="nav-links">
                <a href="catalogo.html">Catalogo</a>
                <a href="contacto.html" aria-current="page">Contacto</a>
                <a class="cart-link" href="carrito.html">Carrito <span data-cart-count hidden>0</span></a>
            </div>
        </nav>
    </header>

    <main class="page-main container">
        <section class="contact-layout">
            <div>
                <p class="eyebrow">Contacto</p>
                <h1>Consultas y encargos personalizados</h1>
                <p>Contanos que pieza queres, medidas, colores y cualquier detalle importante. El mensaje se abre en WhatsApp para que puedas enviarlo desde tu cuenta.</p>
            </div>

            <form class="contact-form" data-contact-form>
                <label>
                    Nombre
                    <input type="text" name="nombre" autocomplete="name" required>
                </label>
                <label>
                    Mensaje
                    <textarea name="mensaje" rows="7" required placeholder="Ej: Quiero consultar por una ruana en tonos naturales."></textarea>
                </label>
                <button class="button button-primary" type="submit">Enviar consulta</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>NGENECHEN. Tejido artesanal en Argentina.</p>
            <a href="catalogo.html">Ver catalogo</a>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
